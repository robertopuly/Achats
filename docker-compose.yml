services:
  achats:
    build: .
    container_name: achats-supermercato
    restart: unless-stopped
    # network_mode: host permette al container sul Synology DS1522+ di rispondere
    # direttamente sia sulla rete locale di casa sia sull'IP 100.x.y.z di Tailscale
    network_mode: host
    environment:
      - NODE_ENV=production
      - PORT=8090
      - DB_PATH=/app/data/achats.db
      - TZ=Europe/Zurich
    volumes:
      # 1. Database SQLite persistente (non viene mai sovrascritto dagli aggiornamenti)
      - ./data:/app/data
      # 2. Collegamento diretto ai file dell'app per aggiornamenti istantanei senza dover rifare "Build"
      - ./templates:/app/templates
      - ./static:/app/static
      - ./server.js:/app/server.js
      - ./pdf_generator.js:/app/pdf_generator.js
      - ./seed_catalog.json:/app/seed_catalog.json
